<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background-color: #fafafa;
    background-image: repeating-linear-gradient(
      -45deg,
      #f7f7f9 0px, #fbfbfc 18px, #ffffff 28px, #fafafa 52px,
      #f6f6f8 54px, #f9f9fb 68px, #ffffff 90px, #fafbfc 118px,
      #f5f6f8 120px, #f8f9fb 130px, #fdfdfe 155px, #ffffff 180px,
      #f9f9fb 210px, #f6f6f9 212px, #f8f9fb 228px, #fefefe 260px,
      #fafbfc 295px, #f6f7f9 297px, #f9f9fb 315px, #ffffff 350px,
      #f7f7f9 368px
    );
    color: #111; font-size: 15px; line-height: 1.6;
  }

/* SITE HEADER */
  .site-header {
    background: #002D72;
    padding: 18px 40px 0;
  }
  .site-header .inner {
    max-width: 860px;
    margin: 0 auto;
    padding-left: 40px;
  }
  .site-header .brand {
    display: inline-block;
    font-size: 20px; font-weight: 600;
    color: #fff; text-decoration: none;
    letter-spacing: -.01em;
    margin-bottom: 14px;
  }

  /* NAV */
  nav {
    background: #002D72;
    border-top: 1px solid rgba(255,255,255,0.15);
    position: sticky; top: 0; z-index: 10;
  }
  .nav-inner {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    padding-left: 40px;
  }
  .nav-links { display: flex; list-style: none; }
  .nav-links a {
    display: block; padding: 0 20px 0 0; height: 44px; line-height: 44px;
    font-size: 14px; color: rgba(255,255,255,0.7); text-decoration: none;
    border-bottom: 2px solid transparent; transition: color .15s, border-color .15s;
  }
  .nav-links a:hover { color: #fff; }
  .nav-links a.active { color: #fff; font-weight: 500; border-bottom-color: #fff; }

  .page-header { max-width: 860px; margin: 0 auto; padding: 52px 40px 36px; border-bottom: 1px solid #e8e8e8; }
  .page-header h1 { font-size: 26px; font-weight: 600; letter-spacing: -.02em; }

  .nilai-wrap { max-width: 860px; margin: 0 auto; padding: 36px 40px 80px; display: flex; flex-direction: column; gap: 20px; }

  /* TAHUN PELAJARAN = KOTAK BESAR */
  .tahun-block {
    border: 1px solid #e8e8e8; border-radius: 8px;
    overflow: hidden; background: #fff;
  }
  .tahun-header {
    padding: 14px 20px;
    background: #f7f8fc;
    border-bottom: 1px solid #e8e8e8;
    font-size: 15px; font-weight: 600; color: #111;
  }

  /* KELAS */
  .kelas-block { padding: 16px 20px; border-bottom: 1px solid #f0f0f0; }
  .kelas-block:last-child { border-bottom: none; }
  .kelas-nama {
    font-size: 13.5px; font-weight: 600; color: #111;
    margin-bottom: 10px;
  }

  /* SEMESTER = KOTAK SENDIRI */
  .semester-grup { display: flex; flex-direction: column; gap: 8px; }
  .semester-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
    border: 1px solid #eee; border-radius: 6px;
    padding: 10px 14px;
    background: #fafafa;
  }
  .semester-label { font-size: 13px; color: #666; }
  .tombol-grup { display: flex; gap: 8px; flex-wrap: wrap; }

  .btn-nilai {
    display: inline-block; padding: 6px 16px;
    border: 1px solid #ddd; border-radius: 5px;
    font-family: inherit; font-size: 13px; font-weight: 500;
    color: #111; text-decoration: none; background: #fff;
    transition: border-color .15s, color .15s, background .15s;
  }
  .btn-nilai:hover { border-color: #002D72; color: #002D72; background: #f0f4ff; }

  .divider { border: none; border-top: 1px solid #e8e8e8; max-width: 860px; margin: 0 auto; }
  footer { max-width: 860px; margin: 0 auto; padding: 28px 40px 48px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
  .footer-name { font-size: 13px; font-weight: 500; color: #aaa; }
  .footer-links { display: flex; gap: 4px; }
  .footer-links a { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 6px; color: #aaa; text-decoration: none; transition: color .15s, background .15s; }
  .footer-links a:hover { color: #002D72; background: rgba(0,45,114,0.07); }

  @media (max-width: 600px) {
    .site-header { padding: 14px 16px 0; }
    .site-header .inner { padding-left: 16px; }
    .nav-inner { padding-left: 16px; }
    .hero, .tujuan, .qr-wrap, footer { padding-left: 20px; padding-right: 20px; }
    .divider { margin-left: 20px; margin-right: 20px; }
    .hero h1 { font-size: 22px; }
    .nav-links a { padding: 0 10px 0 0; font-size: 13px; }
  }
</style>

<script>
// =============================================
// DATA NILAI
// Struktur: array tahun pelajaran
// Setiap tahun punya array kelas
// Setiap kelas punya array semester
// Setiap semester punya array tombol nilai
//
// Untuk menambah tahun: tambah objek baru di array
// Untuk menambah kelas: tambah objek di array "kelas"
// Untuk menambah semester: tambah objek di array "semester"
// Untuk menambah tombol: tambah objek di array "tombol"
// =============================================
const data = [
  {
    tahun: "Tahun Pelajaran 2025/2026",
    kelas: [
      {
        nama: "XI TJKT",
        semester: [
          {
            nama: "Semester Gasal",
            tombol: [
              { label: "Praktik", link: "https://docs.google.com/spreadsheets/d/e/2PACX-1vR-s1Z3AQ6BdT9msJH2Nifq3tu2VNuUGaJPJprM9KHMfhuFgSz6-gAdmITjJvk5f5OcsGQ6irxRNqma/pubhtml" },
              { label: "Quiz",    link: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTupb2ssG1Sm-5z2pgZ7jbzj_9zgkFPUeigziwF08-9GOFZiRmIWHEY0nwFxynl7kJ6xo78ohFbdOsR/pubhtml" },
            ]
          },
          {
            nama: "Semester Genap",
            tombol: [
              { label: "Praktik", link: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSiQ-buhQUo33ATjJIKcwHpavLNpDSNN2s-l_F0rH8UiCXi7NrHzJVysd7ZiX_NlJmA7kUFnutVnRz1/pubhtml" },
              { label: "Quiz",    link: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ_v7l4KojoMDoYdWV8owAFK763pswBVUPwEqrOF2Lwg-NJ5I9EfsPXiDlk38E7u-UR7pj6Nw_rZxiD/pubhtml" },
            ]
          },
        ]
      },
      {
        nama: "XII TJKT",
        semester: [
          {
            nama: "Semester Genap",
            tombol: [
              { label: "Praktik", link: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSvJsLjeTA0DWxdYcK5XWAARycRl_vaiRuiVXZ64tQKM2WEbYHbTI3F4wK2EnwWFFxJLolgAyLuttQJ/pubhtml" },
              { label: "Quiz",    link: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTx9joyyjFN60Q1G3J_np0XgA70MyQyuasZdcH-x_Zv5oGcXAiGZf7eq8MnobHSb2owAO7iCJfSZnte/pubhtml" },
            ]
          },
        ]
      },
    ]
  },
];
// =============================================

const wrap = document.getElementById('nilaiWrap');

data.forEach(tp => {
  const tahunBlock = document.createElement('div');
  tahunBlock.className = 'tahun-block';
  tahunBlock.innerHTML = `<div class="tahun-header">${tp.tahun}</div>`;

  tp.kelas.forEach(kls => {
    const kelasBlock = document.createElement('div');
    kelasBlock.className = 'kelas-block';

    const smtGrupHTML = kls.semester.map(smt => {
      const tombolHTML = smt.tombol.map(t =>
        `<a class="btn-nilai" href="${t.link}" target="_blank">${t.label}</a>`
      ).join('');
      return `
        <div class="semester-row">
          <div class="semester-label">${smt.nama}</div>
          <div class="tombol-grup">${tombolHTML}</div>
        </div>`;
    }).join('');

    kelasBlock.innerHTML = `
      <div class="kelas-nama">${kls.nama}</div>
      <div class="semester-grup">${smtGrupHTML}</div>
    `;
    tahunBlock.appendChild(kelasBlock);
  });

  wrap.appendChild(tahunBlock);
});
</script>
