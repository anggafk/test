<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background-color: #fafafa;
    background-image: repeating-linear-gradient(
      -45deg,
      #f7f7f9 0px, #fbfbfc 18px, #ffffff 28px, #fafafa 52px,
      #f6f6f8 54px, #f9f9fb 68px, #ffffff 90px, #fafbfc 118px,
      #f5f6f8 120px, #f8f9fb 130px, #fdfdfe 155px, #ffffff 180px,
      #f9f9fb 210px, #f6f6f9 212px, #f8f9fb 228px, #fefefe 260px,
      #fafbfc 295px, #f6f7f9 297px, #f9f9fb 315px, #ffffff 350px,
      #f7f7f9 368px
    );
    color: #111;
    font-size: 15px;
    line-height: 1.6;
  }

  nav {
    padding: 0 40px;
    display: flex; align-items: center; justify-content: space-between;
    height: 56px; position: sticky; top: 0; background: #002D72; z-index: 10;
  }
  .nav-brand { font-size: 14px; font-weight: 600; color: #fff; text-decoration: none; }
  .nav-links { display: flex; list-style: none; }
  .nav-links a {
    display: block; padding: 0 16px; height: 56px; line-height: 56px;
    font-size: 14px; color: rgba(255,255,255,0.7); text-decoration: none;
    border-bottom: 2px solid transparent; transition: color .15s, border-color .15s;
  }
  .nav-links a:hover { color: #fff; }
  .nav-links a.active { color: #fff; font-weight: 500; border-bottom-color: #fff; }

  .page-header {
    max-width: 720px; margin: 0 auto;
    padding: 52px 40px 36px;
    border-bottom: 1px solid #e8e8e8;
  }
  .page-header h1 { font-size: 26px; font-weight: 600; letter-spacing: -.02em; }

  /* GRUP MATERI */
  .materi-wrap { max-width: 720px; margin: 0 auto; padding: 0 40px 80px; }

  .grup {
    margin-top: 36px;
    border: 1px solid #e8e8e8;
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
  }
  .grup-header {
    padding: 16px 20px;
    background: #f7f8fc;
    border-bottom: 1px solid #e8e8e8;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .grup-title { font-size: 15px; font-weight: 600; color: #111; }
  .grup-count { font-size: 12px; color: #999; }

  .materi-item {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 20px;
    border-bottom: 1px solid #f0f0f0;
  }
  .materi-item:last-child { border-bottom: none; }

  .materi-num { flex-shrink: 0; width: 24px; font-size: 12.5px; color: #ccc; font-weight: 500; text-align: right; }
  .materi-title { flex: 1; font-size: 14px; color: #222; }
  .btn-text {
    display: inline-block; padding: 6px 14px;
    border: 1px solid #ddd; border-radius: 5px;
    font-family: inherit; font-size: 13px; font-weight: 500;
    color: #111; text-decoration: none; background: #fff;
    transition: border-color .15s, color .15s; white-space: nowrap; flex-shrink: 0;
  }
  .btn-text:hover { border-color: #002D72; color: #002D72; }

  /* FOOTER */
  .divider { border: none; border-top: 1px solid #e8e8e8; max-width: 720px; margin: 0 auto; }
  footer {
    max-width: 720px; margin: 0 auto;
    padding: 28px 40px 48px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
  }
  .footer-name { font-size: 13px; font-weight: 500; color: #aaa; }
  .footer-links { display: flex; gap: 4px; align-items: center; }
  .footer-links a {
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 6px;
    color: #aaa; text-decoration: none; transition: color .15s, background .15s;
  }
  .footer-links a:hover { color: #002D72; background: rgba(0,45,114,0.07); }

  @media (max-width: 600px) {
    nav { padding: 0 16px; }
    .page-header, .materi-wrap, footer { padding-left: 20px; padding-right: 20px; }
    .nav-links a { padding: 0 10px; font-size: 13px; }
  }
</style>
</head>

<script>
// =============================================
// DATA MATERI
// Untuk menambah grup: tambah objek baru di array
// Untuk menambah materi: tambah item di array "materi"
// Untuk menghapus: hapus baris yang sesuai
// =============================================
const data = [
  {
    grup: "Perencanaan dan Pengalamatan Jaringan",
    materi: [
      { judul: "Alamat Jaringan Komputer",      link: "materi-detail.html" },
      { judul: "Alamat IP",                     link: "materi-detail.html" },
      { judul: "Konfigurasi Alamat IP di Windows", link: "materi-detail.html" },
      { judul: "Pemecahan Alamat IP (Subnetting)", link: "materi-detail.html" },
      { judul: "Subnetting VLSM",               link: "materi-detail.html" },
    ]
  },
  {
    grup: "Pemasangan dan Konfigurasi Perangkat Jaringan",
    materi: [
      { judul: "Menghubungkan Router ke PC",    link: "materi-menghubungkan-router.html" },
      { judul: "Konfigurasi Dasar Router",      link: "materi-detail.html" },
      { judul: "Konfigurasi DHCP",              link: "materi-detail.html" },
      { judul: "Konfigurasi Routing",           link: "materi-detail.html" },
      { judul: "Konfigurasi Wireless",          link: "materi-detail.html" },
      { judul: "Konfigurasi Hotspot",           link: "materi-detail.html" },
      { judul: "Konfigurasi Filter",            link: "materi-detail.html" },
    ]
  },
];
// =============================================

const wrap = document.getElementById('materiWrap');
data.forEach(g => {
  const grup = document.createElement('div');
  grup.className = 'grup';
  grup.innerHTML = `
    <div class="grup-header">
      <span class="grup-title">${g.grup}</span>
      <span class="grup-count">${g.materi.length} materi</span>
    </div>
    ${g.materi.map((m, i) => `
    <div class="materi-item">
      <div class="materi-num">${i + 1}</div>
      <div class="materi-title">${m.judul}</div>
      <a class="btn-text" href="${m.link}">Lihat Materi →</a>
    </div>`).join('')}
  `;
  wrap.appendChild(grup);
});
</script>
